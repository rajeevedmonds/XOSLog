name: Generate GitHub Release

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v1.0.0

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to publish the release

    steps:
      - name: Create Release and Auto-Generate Notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # Creates a changelog from your commit messages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
